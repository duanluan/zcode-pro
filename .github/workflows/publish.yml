name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: 校验版本号一致
        run: |
          npm_version="$(node -p "require('./package.json').version")"
          py_version="$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('zcode_pro/__init__.py').read_text(encoding='utf-8')).group(1))")"
          if [ "$npm_version" != "$py_version" ]; then
            echo "package.json ($npm_version) 与 zcode_pro/__init__.py ($py_version) 版本号不一致" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$npm_version" ]; then
            echo "tag $GITHUB_REF_NAME 与版本号 v$npm_version 不一致" >&2
            exit 1
          fi

      - name: 已发布则跳过
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "zcode-pro@$version" version >/dev/null 2>&1; then
            echo "zcode-pro@$version 已存在于 npm，跳过"
            echo "npm_skip=true" >> "$GITHUB_ENV"
          fi

      - name: 发布到 npm
        if: env.npm_skip != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # dist/inject.js 不入 git，打包前先构建
      - run: npm ci && npm run build

      - run: python -m pip install build

      - name: 构建源码包与 wheel
        run: python -m build --outdir dist-py

      - name: 已发布则跳过
        run: |
          version="$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('zcode_pro/__init__.py').read_text(encoding='utf-8')).group(1))")"
          if curl -fsSI "https://pypi.org/pypi/zcode-pro/$version/json" >/dev/null 2>&1; then
            echo "zcode-pro $version 已存在于 PyPI，跳过"
            echo "pypi_skip=true" >> "$GITHUB_ENV"
          fi

      - name: 发布到 PyPI
        if: env.pypi_skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist-py  # 构建产物目录（避开 JS 的 dist/）
          attestations: false  # token 方式发布，不做 PEP 740 证明签名
